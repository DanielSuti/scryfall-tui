[package]
name = "scry"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "LazyVim-style terminal UI for Scryfall card search"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nucleo-matcher = "0.3"
ratatui = "0.30"
# Without libchafa: terminals with no graphics protocol show no image.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
toml = "1.1"
tui-input = "0.15"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1.49"
wiremock = "0.6"
tokio = { version = "1.54", features = ["test-util"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
